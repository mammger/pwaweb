<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="PWA Web 服务" />
    <title>PWA Web</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #f0f4ff;
        color: #1e293b;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      header {
        background: #2563eb;
        color: #fff;
        width: 100%;
        padding: 1rem 1.5rem;
        text-align: center;
        position: fixed;
        top: 0;
        left: 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      header h1 {
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      main {
        margin-top: 4rem;
        padding: 2rem 1.5rem;
        max-width: 480px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      .card {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.1);
        padding: 2rem 1.5rem;
        width: 100%;
        text-align: center;
      }

      .card .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }

      .card h2 {
        font-size: 1.3rem;
        margin-bottom: 0.5rem;
        color: #2563eb;
      }

      .card p {
        font-size: 0.95rem;
        color: #475569;
        line-height: 1.6;
      }

      .status-badge {
        display: inline-block;
        padding: 0.3rem 0.8rem;
        border-radius: 2rem;
        font-size: 0.8rem;
        font-weight: 600;
        background: #dcfce7;
        color: #16a34a;
        margin-top: 0.75rem;
      }

      .status-badge.offline {
        background: #fef9c3;
        color: #ca8a04;
      }

      .install-btn {
        display: none;
        margin-top: 1rem;
        padding: 0.6rem 1.4rem;
        border: none;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .install-btn:hover {
        background: #1d4ed8;
      }

      footer {
        margin-top: auto;
        padding: 1.5rem;
        font-size: 0.8rem;
        color: #94a3b8;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>📱 PWA Web</h1>
    </header>

    <main>
      <div class="card">
        <div class="icon">🚀</div>
        <h2>欢迎使用 PWA Web</h2>
        <p>这是一个基于 Progressive Web App 技术构建的网页应用，支持离线访问、快速加载和安装到桌面。</p>
        <span class="status-badge" id="network-status">● 在线</span>
        <br />
        <button class="install-btn" id="install-btn">安装到桌面</button>
      </div>

      <div class="card">
        <div class="icon">⚡</div>
        <h2>PWA 特性</h2>
        <p>
          ✅ 离线缓存（Service Worker）<br />
          ✅ 可安装到主屏幕<br />
          ✅ 自适应移动端布局<br />
          ✅ 快速启动与加载
        </p>
      </div>
    </main>

    <footer>
      &copy; 2024 PWA Web &nbsp;|&nbsp; Service Worker 已就绪
    </footer>

    <script>
      // Register Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("service-worker.js")
            .then((reg) => {
              console.log("Service Worker registered:", reg.scope);
            })
            .catch((err) => {
              console.warn("Service Worker registration failed:", err);
            });
        });
      }

      // Network status indicator
      const statusBadge = document.getElementById("network-status");
      function updateNetworkStatus() {
        if (navigator.onLine) {
          statusBadge.textContent = "● 在线";
          statusBadge.classList.remove("offline");
        } else {
          statusBadge.textContent = "● 离线";
          statusBadge.classList.add("offline");
        }
      }
      window.addEventListener("online", updateNetworkStatus);
      window.addEventListener("offline", updateNetworkStatus);
      updateNetworkStatus();

      // PWA install prompt
      let deferredPrompt;
      const installBtn = document.getElementById("install-btn");
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = "inline-block";
      });
      installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log("Install outcome:", outcome);
        deferredPrompt = null;
        installBtn.style.display = "none";
      });
    </script>
  </body>
</html>
